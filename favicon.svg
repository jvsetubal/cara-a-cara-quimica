<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Orbital Rings -->
  <ellipse cx="32" cy="32" rx="23" ry="9" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" transform="rotate(30 32 32)"/>
  <ellipse cx="32" cy="32" rx="23" ry="9" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 2" transform="rotate(-30 32 32)"/>
  <ellipse cx="32" cy="32" rx="23" ry="9" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 2" transform="rotate(90 32 32)"/>
  <!-- Nucleus Glow -->
  <circle cx="32" cy="32" r="7" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
  <!-- Orbiting electrons -->
  <circle cx="48" cy="24" r="2.2" fill="#38bdf8"/>
  <circle cx="16" cy="40" r="2.2" fill="#a855f7"/>
</svg>

